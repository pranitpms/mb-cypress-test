name: Cypress Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to test"
        required: false
        default: "https://mb.io/en-AE"

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox, edge ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: ${{ matrix.browser }}
        env:
          CYPRESS_BASE_URL: ${{ github.event.inputs.base_url || vars.BASE_URL || 'https://mb.io/en-AE' }}

      - name: Upload videos, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ matrix.browser }}
          path: run-log/
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "### Cypress (${{ matrix.browser }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: run-log-${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"